<input name="animation" type="hidden">

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const outputBox = document.getElementById('output-box');
  const transcriptionText = document.getElementById('transcription-text');
  
  const videoContainer = document.getElementById('video-container');
  const videoPlayer = document.getElementById('video-player');
  const captionTrack = document.getElementById('caption-track');

  // Convertitore di percorsi per il protocollo locale di Tauri v2
  function getTauriAssetUrl(filePath) {
    if (window.__TAURI__?.core?.convertFileSrc) {
      return window.__TAURI__.core.convertFileSrc(filePath);
    }
    return filePath;
  }

  // Funzione per avviare la trascrizione
  async function processFile(filePath) {
    if (!filePath) return;
    
    console.log("File selezionato:", filePath);
    
    // Resetta stati precedenti
    outputBox.style.display = 'block';
    videoContainer.style.display = 'none';
    transcriptionText.textContent = "Trascrizione e generazione sottotitoli in corso con Whisper... Attendere prego.";

    try {
      const invoke = window.__TAURI__?.core?.invoke || window.__TAURI__?.invoke;
      if (!invoke) {
        throw new Error("Tauri API non trovata. Assicurati di eseguire l'app dentro Tauri.");
      }

      // Invocazione backend Rust (restituisce il testo trascritto)
      const risultato = await invoke('transrivi_audio', { filePath: filePath });
      transcriptionText.textContent = risultato;

      // Se il file è un video (mp4, mkv, mov, avi, webm), carica il player video e il file VTT generato da Whisper
      const ext = filePath.split('.').pop().toLowerCase();
      const isVideo = ['mp4', 'mov', 'mkv', 'avi', 'webm'].includes(ext);

      if (isVideo) {
        // Whisper genera il file .vtt nello stesso percorso del video
        const vttPath = filePath.substring(0, filePath.lastIndexOf('.')) + '.vtt';

        // Imposta sorgente video e sottotitoli usando la conversione sicura di Tauri
        videoPlayer.src = getTauriAssetUrl(filePath);
        captionTrack.src = getTauriAssetUrl(vttPath);

        // Mostra il container del video
        videoContainer.style.display = 'block';
        videoPlayer.load();
      }

    } catch (err) {
      console.error("Errore trascrizione:", err);
      transcriptionText.textContent = "Errore durante la trascrizione: " + (err.message || err);
    }
  }

  // 1. Apertura selettore file al click sul box
  dropZone.addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      const file = e.target.files[0];
      const filePath = file.path || file.name;
      processFile(filePath);
    }
  });

  // 2. Drag & Drop standard browser
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.style.borderColor = '#007bff';
  });

  dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.style.borderColor = '#ccc';
  });

  dropZone.addEventListener('drop', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.style.borderColor = '#ccc';

    const files = e.dataTransfer.files;
    if (files.length > 0) {
      const filePath = files[0].path;
      processFile(filePath);
    }
  });

  // 3. Ascoltatore nativo Drag & Drop di Tauri v2 (garantisce il recupero del percorso su macOS)
  if (window.__TAURI__ && window.__TAURI__.event) {
    window.__TAURI__.event.listen('tauri://drag-drop', (event) => {
      if (event.payload && event.payload.paths && event.payload.paths.length > 0) {
        processFile(event.payload.paths[0]);
      }
    });
  }
</script>
