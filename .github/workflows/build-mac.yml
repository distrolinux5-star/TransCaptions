name: Build Tauri Mac App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (npm)
        run: npm install

      - name: Scarica e compila whisper-cli per macOS
        run: |
          mkdir -p src-tauri/binaries
          git clone https://github.com/ggerganov/whisper.cpp.git temp-whisper
          cd temp-whisper
          make
          if [ -f "whisper-cli" ]; then
            cp whisper-cli ../src-tauri/binaries/whisper-cli-aarch64-apple-darwin
          else
            cp main ../src-tauri/binaries/whisper-cli-aarch64-apple-darwin
          fi
          cd ..
          rm -rf temp-whisper
          chmod +x src-tauri/binaries/whisper-cli-aarch64-apple-darwin

      - name: Build Tauri app for macOS
        uses: tauri-apps/tauri-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}