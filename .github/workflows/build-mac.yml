name: Build Tauri Mac App (Dual Architecture)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (npm)
        run: npm install

      - name: Compila whisper.cpp e posiziona il binario
        shell: bash
        run: |
          set -e
          echo "Directory corrente: $(pwd)"
          
          # Crea la cartella binaries
          mkdir -p src-tauri/binaries
          
          echo "Clonazione e compilazione whisper.cpp..."
          git clone https://github.com/ggerganov/whisper.cpp.git /tmp/whisper-src
          cd /tmp/whisper-src
          
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          
          FOUND_BIN=$(find build -name "whisper-cli" -o -name "main" -type f | head -n 1)
          echo "Eseguibile trovato da CMake: $FOUND_BIN"
          
          if [ -z "$FOUND_BIN" ]; then
            echo "ERRORE: whisper-cli non trovato!"
            exit 1
          fi
          
          # Percorso di destinazione relativo alla root del repo
          DEST_PATH="src-tauri/binaries/whisper-cli-${{ matrix.target }}"
          echo "Copia in: $DEST_PATH"
          cp "$FOUND_BIN" "$DEST_PATH"
          chmod +x "$DEST_PATH"
          
          cd -
          rm -rf /tmp/whisper-src
          
          echo "=== CONTROLLO FINALE CONTENUTO CARTELLA BINARIES ==="
          ls -la src-tauri/binaries/
          
          if [ ! -f "$DEST_PATH" ]; then
            echo "ERRORE CRITICO: Il file $DEST_PATH non esiste!"
            exit 1
          else
            echo "SUCCESSO: Il file binario esiste ed è pronto."
          fi

      - name: Scarica il modello Whisper (ggml-small.bin)
        run: |
          mkdir -p src-tauri/models
          curl -L -o src-tauri/models/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin

      - name: Build Tauri app for ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v0.5.0
        with:
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}