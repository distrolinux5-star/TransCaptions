name: Build Tauri Mac App (Dual Architecture)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            bin_suffix: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            bin_suffix: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (npm)
        run: npm install

      - name: Compila whisper.cpp e posiziona il binario
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri/binaries
          git clone https://github.com/ggerganov/whisper.cpp.git temp-whisper
          cd temp-whisper
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          
          echo "=== Controllo contenuto build/bin ==="
          ls -la build/bin || true
          
          if [ -f "build/bin/whisper-cli" ]; then
            cp build/bin/whisper-cli ../src-tauri/binaries/whisper-cli-${{ matrix.bin_suffix }}
          elif [ -f "build/bin/main" ]; then
            cp build/bin/main ../src-tauri/binaries/whisper-cli-${{ matrix.bin_suffix }}
          else
            FOUND_BIN=$(find build -name "whisper-cli" -o -name "main" -type f | head -n 1)
            if [ -z "$FOUND_BIN" ]; then
              echo "ERRORE CRITICO: whisper-cli non trovato nella build di CMake!"
              exit 1
            fi
            cp "$FOUND_BIN" ../src-tauri/binaries/whisper-cli-${{ matrix.bin_suffix }}
          fi
          
          cd ..
          rm -rf temp-whisper
          chmod +x src-tauri/binaries/whisper-cli-${{ matrix.bin_suffix }}
          
          echo "=== VERIFICA FINALE NELLA CARTELLA BINARIES ==="
          ls -la src-tauri/binaries/
          
          if [ ! -f "src-tauri/binaries/whisper-cli-${{ matrix.bin_suffix }}" ]; then
            echo "ERRORE: Il file binario non esiste nella cartella di destinazione!"
            exit 1
          fi

      - name: Scarica il modello Whisper (ggml-small.bin)
        run: |
          mkdir -p src-tauri/models
          curl -L -o src-tauri/models/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin

      - name: Build Tauri app for ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v0.5.0
        with:
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}