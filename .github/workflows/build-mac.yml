name: Build Tauri Mac App (Dual Architecture)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            bin_suffix: aarch64-apple-darwin
          - target: x86_64-apple-darwin
            bin_suffix: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (npm)
        run: npm install

      - name: Compila whisper.cpp e posiziona il binario alla radice di src-tauri
        shell: bash
        run: |
          set -e
          git clone https://github.com/ggerganov/whisper.cpp.git temp-whisper
          cd temp-whisper
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          
          FOUND_BIN=$(find build -name "whisper-cli" -o -name "main" -type f | head -n 1)
          
          # Posiziona il binario direttamente in src-tauri/ con il suffisso del target
          DEST_FILE="../src-tauri/whisper-cli-${{ matrix.target }}"
          cp "$FOUND_BIN" "$DEST_FILE"
          chmod +x "$DEST_FILE"
          
          cd ..
          rm -rf temp-whisper
          
          echo "=== VERIFICA PRESENZA BINARIO ==="
          ls -la src-tauri/whisper-cli-${{ matrix.target }}

      - name: Scarica il modello Whisper (ggml-small.bin)
        run: |
          mkdir -p src-tauri/models
          curl -L -o src-tauri/models/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin

      - name: Build Tauri app for ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v0.5.0
        with:
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}