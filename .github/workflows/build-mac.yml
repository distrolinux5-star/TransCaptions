name: Build Tauri Mac App (Dual Architecture & Release)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact_name: aarch64
          - target: x86_64-apple-darwin
            artifact_name: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (npm)
        run: npm install

      - name: Fix permissions for Tauri CLI in node_modules
        run: chmod +x node_modules/.bin/tauri

      - name: Build frontend web assets (Crea la cartella dist)
        run: npm run build

      - name: Scarica il modello Whisper reale (ggml-small.bin)
        run: |
          mkdir -p src-tauri/models
          echo "Scaricamento modello Whisper reale..."
          curl -L -o src-tauri/models/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
          ls -lh src-tauri/models/

      - name: Compila whisper.cpp e sovrascrivi il binario segnaposto
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/binaries"
          
          git clone https://github.com/ggerganov/whisper.cpp.git /tmp/whisper-src
          cd /tmp/whisper-src
          
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          
          FOUND_BIN=$(find build -name "whisper-cli" -o -name "main" -type f | head -n 1)
          
          TARGET_FILE="$GITHUB_WORKSPACE/src-tauri/binaries/whisper-cli-${{ matrix.target }}"
          cp "$FOUND_BIN" "$TARGET_FILE"
          chmod +x "$TARGET_FILE"
          
          rm -rf /tmp/whisper-src
          echo "Binario reale posizionato in: $TARGET_FILE"
          ls -lh "$TARGET_FILE"

      - name: Build Tauri app for ${{ matrix.target }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundles-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/tauri-bundles-aarch64/**/*.dmg
            all-artifacts/tauri-bundles-aarch64/**/*.app
            all-artifacts/tauri-bundles-x86_64/**/*.dmg
            all-artifacts/tauri-bundles-x86_64/**/*.app
          tag_name: v0.1.0
          name: "TransCaptions v0.1.0"
          body: "Release ufficiale per macOS contenente le versioni Apple Silicon (ARM64) e Intel (x86_64)."
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}