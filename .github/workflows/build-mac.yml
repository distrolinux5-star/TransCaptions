name: Build Tauri Mac App (Dual Architecture)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (npm)
        run: npm install

      - name: 1. Scarica SUBITO il modello Whisper (ggml-small.bin)
        run: |
          mkdir -p src-tauri/models
          echo "Scaricamento del modello Whisper..."
          curl -L -o src-tauri/models/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
          ls -la src-tauri/models/

      - name: 2. Compila whisper.cpp e posiziona il binario
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/binaries"
          
          git clone https://github.com/ggerganov/whisper.cpp.git /tmp/whisper-src
          cd /tmp/whisper-src
          
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          
          FOUND_BIN=$(find build -name "whisper-cli" -o -name "main" -type f | head -n 1)
          
          TARGET_FILE="$GITHUB_WORKSPACE/src-tauri/binaries/whisper-cli-${{ matrix.target }}"
          cp "$FOUND_BIN" "$TARGET_FILE"
          chmod +x "$TARGET_FILE"
          
          rm -rf /tmp/whisper-src
          echo "Binario posizionato correttamente in: $TARGET_FILE"

      - name: 3. Build Tauri app for ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v0.5.0
        with:
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}