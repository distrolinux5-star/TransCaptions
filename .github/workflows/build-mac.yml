name: Build Tauri Mac App (Dual Architecture)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (npm)
        run: npm install

      - name: Compila whisper.cpp e posiziona con percorso assoluto
        shell: bash
        run: |
          set -e
          echo "Workspace principale: $GITHUB_WORKSPACE"
          
          # Crea la cartella binaries con percorso assoluto
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/binaries"
          
          # Clona in una cartella temporanea di sistema (/tmp) per isolare la build
          git clone https://github.com/ggerganov/whisper.cpp.git /tmp/temp-whisper
          cd /tmp/temp-whisper
          
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          
          FOUND_BIN=$(find build -name "whisper-cli" -o -name "main" -type f | head -n 1)
          echo "Binario trovato: $FOUND_BIN"
          
          # Destinazione assoluta blindata
          DEST_FILE="$GITHUB_WORKSPACE/src-tauri/binaries/whisper-cli-${{ matrix.target }}"
          echo "Copia forzata in: $DEST_FILE"
          cp "$FOUND_BIN" "$DEST_FILE"
          chmod +x "$DEST_FILE"
          
          echo "=== VERIFICA FINALE CARTELLA BINARIES ==="
          ls -la "$GITHUB_WORKSPACE/src-tauri/binaries/"
          
          if [ ! -f "$DEST_FILE" ]; then
            echo "ERRORE: Il file non esiste nella destinazione!"
            exit 1
          fi

      - name: Scarica il modello Whisper (ggml-small.bin)
        run: |
          mkdir -p src-tauri/models
          curl -L -o src-tauri/models/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin

      - name: Build Tauri app for ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v0.5.0
        with:
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}