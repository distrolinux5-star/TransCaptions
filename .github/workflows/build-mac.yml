name: Build Tauri Mac App (Dual Architecture)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (npm)
        run: npm install

      - name: Compila whisper.cpp e posiziona il binario per il sidecar
        shell: bash
        run: |
          set -e
          echo "Workspace root: $GITHUB_WORKSPACE"
          
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/binaries"
          
          git clone https://github.com/ggerganov/whisper.cpp.git /tmp/whisper-src
          cd /tmp/whisper-src
          
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          
          FOUND_BIN=$(find build -name "whisper-cli" -o -name "main" -type f | head -n 1)
          echo "Binario trovato: $FOUND_BIN"
          
          # NOTA: Per il sidecar Tauri v2 si aspetta il suffisso del target completo
          DEST_ABSOLUTE="$GITHUB_WORKSPACE/src-tauri/binaries/whisper-cli-${{ matrix.target }}"
          echo "Copia assoluta in: $DEST_ABSOLUTE"
          cp "$FOUND_BIN" "$DEST_ABSOLUTE"
          chmod +x "$DEST_ABSOLUTE"
          
          rm -rf /tmp/whisper-src
          
          echo "=== VERIFICA NEL REPO REALE ==="
          ls -la "$GITHUB_WORKSPACE/src-tauri/binaries/"

      - name: Scarica il modello Whisper (ggml-small.bin)
        run: |
          mkdir -p src-tauri/models
          curl -L -o src-tauri/models/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin

      - name: Build Tauri app for ${{ matrix.target }}
        uses: tauri-apps/tauri-action@v0.5.0
        with:
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}