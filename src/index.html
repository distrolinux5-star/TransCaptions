<script>
  const { invoke } = window.__TAURI__.core;

  const dropZone = document.getElementById('drop-zone') || document.body;
  const outputBox = document.getElementById('output-box');
  const transcriptionText = document.getElementById('transcription-text');

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
  });

  dropZone.addEventListener('drop', async (e) => {
    e.preventDefault();
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      const filePath = files[0].path;
      console.log("File caricato:", filePath);

      outputBox.style.display = 'block';
      transcriptionText.textContent = "Trascrizione in corso con Whisper... Attendere prego.";

      try {
        const risultato = await invoke('transrivi_audio', { filePath: filePath });
        transcriptionText.textContent = risultato;
      } catch (err) {
        console.error("Errore trascrizione:", err);
        transcriptionText.textContent = "Errore: " + err;
      }
    }
  });
</script>
